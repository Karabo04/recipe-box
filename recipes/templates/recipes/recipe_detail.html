<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
     {% if recipe.image %}
     <img src="{{ recipe.image.url }}" style="width:100%; height:380px; object-fit:cover;">
    {% endif %}
    <h2>((recipe.title))</h2>
    <p>{{recipe.description}}</p>
    <p>{{recipe.cooking_time}}min ● {{recipe.category}} ● {{recipe.difficulty}} </p>

    <h3>Ingredients</h3>
    <p>{{recipe.ingredients}}</p>

    <h3>Ingredients</h3>
    <p>{{recipe.ingredients}}</p>



</body>
</html>
