<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipes</title>
</head>
<body>
    {% for recipe in recipes %}
     {% if recipe.image %}
      <img src="{{ recipe.image.url }}" style="width:100%; height:200px; object-fit:cover;">
    {% else %}
      <div style="height:200px; background:#eee;">No image</div>
    {% endif %}
    <h3>{{recipe.title}}</h3>
    <p>{{recipe.category}}</p>
    <p>{{recipe.cooking_time}} mins</p>
    <p>{{recipes.description}}</p>
    {% endfor %}
</body>
</html>
